<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>函数调用栈 · 板书演示</title>
<style>
  :root {
    --blue: #1565c0;
    --blue-light: #e3f2fd;
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --orange: #ef6c00;
    --orange-light: #fff3e0;
    --gray: #9e9e9e;
    --ink: #263238;
    --border: #cfd8dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: #f0f2f5;
    color: var(--ink);
    padding: 24px;
  }
  h1 { text-align: center; color: var(--blue); margin: 0 0 4px; font-size: 26px; }
  .sub { text-align: center; color: #607d8b; margin-bottom: 20px; font-size: 14px; }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 24px 28px 28px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    flex: 1; min-width: 140px; padding: 10px 14px;
    border: 2px solid var(--border); background: #fafafa; border-radius: 8px;
    cursor: pointer; font-size: 15px; font-weight: 600; color: #546e7a;
    transition: all .15s;
  }
  .tab:hover { border-color: var(--blue); color: var(--blue); }
  .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #f5f7fa; padding: 14px 16px; border-radius: 8px; margin-bottom: 20px;
  }
  .controls label { font-size: 14px; color: #455a64; }
  .controls input {
    width: 90px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 15px; font-family: "Consolas", monospace;
  }
  .controls button {
    padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #fff; background: var(--blue); transition: opacity .15s;
  }
  .controls button:hover { opacity: .85; }
  .controls button.secondary { background: #78909c; }
  .controls button.go { background: var(--green); }
  .controls button:disabled { background: #cfd8dc; cursor: not-allowed; }
  .hint { font-size: 13px; color: #90a4ae; margin: -12px 0 18px 2px; }

  .board {
    background: #fbfcfd; border: 1px solid var(--border); border-radius: 10px;
    padding: 24px; min-height: 220px;
  }
  .board-empty { text-align: center; color: #b0bec5; padding: 40px 0; font-size: 15px; }

  .stack-col { display: flex; flex-direction: column; gap: 10px; }
  .frame {
    border: 2px solid var(--border);
    border-radius: 8px;
    background: #fff;
    padding: 10px 16px;
    font-family: "Consolas", monospace;
    transition: all .2s;
  }
  .frame .fname { font-size: 16px; font-weight: 700; color: #455a64; }
  .frame .fsub { font-size: 13px; color: #78909c; margin-top: 4px; line-height: 1.6; }
  .frame.active { border-color: var(--blue); background: var(--blue-light); }
  .frame.active .fname { color: var(--blue); }
  .frame.basecase { border-color: var(--orange); background: var(--orange-light); }
  .frame.basecase .fname { color: var(--orange); }
  .frame.returning { border-color: var(--green); background: var(--green-light); }
  .frame.returning .fname { color: var(--green); }
  .frame .rv {
    display: inline-block; margin-left: 10px; font-size: 13px; font-weight: 700;
    color: #fff; background: var(--green); border-radius: 10px; padding: 1px 9px;
  }
  .stack-hint { font-size: 12px; color: #b0bec5; margin-bottom: 8px; }

  .log {
    margin-top: 18px; background: #263238; color: #b2ff59; border-radius: 8px;
    padding: 14px 16px; font-family: "Consolas", monospace; font-size: 14px;
    min-height: 90px; max-height: 220px; overflow-y: auto; line-height: 1.7;
  }
  .log div { opacity: .55; }
  .log div:last-child { opacity: 1; color: #eeff41; }
  .log .placeholder { color: #607d8b; opacity: 1; }

  @media (prefers-color-scheme: dark) {
    body { background: #14181b; color: #e0e0e0; }
    .wrap { background: #1e2428; box-shadow: none; }
    .frame { background: #263238; color: #e0e0e0; border-color: #37474f; }
    .frame .fname { color: #cfd8dc; }
    .frame.active { background: #1a2f45; }
    .frame.basecase { background: #3a2a12; }
    .frame.returning { background: #163a20; }
    .controls { background: #262c30; }
    .board { background: #1a1f22; border-color: #37474f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>函数调用栈 · 电子板书</h1>
  <div class="sub">第 6 章配套演示 &nbsp;|&nbsp; 输入数字、点"下一步"，看栈帧怎么被压入、又怎么一层层弹出</div>

  <div class="tabs">
    <button class="tab active" data-mode="isprime">函数调用</button>
    <button class="tab" data-mode="power">递归求幂</button>
    <button class="tab" data-mode="gcd">递归求最大公约数</button>
  </div>

  <div class="controls" id="controls"></div>
  <div class="hint" id="hint"></div>

  <div class="board" id="board">
    <div class="board-empty">点击"生成演示"开始</div>
  </div>

  <div class="log" id="log"><div class="placeholder">// 这里会实时打印每一步的调用过程</div></div>
</div>

<script>
(function () {
  "use strict";

  var MODE_INFO = {
    isprime: {
      title: "函数调用（判断素数）",
      hint: "非递归调用：main 喊一次 isPrime，栈帧压入、循环跑完、弹出，重点看形参 n 只是一份拷贝。",
      inputs: [{ id: "n", label: "n =", def: 15 }]
    },
    power: {
      title: "递归求幂 power(x, n)",
      hint: "递去时栈越叠越高，归来时每一层都要用子调用的结果乘一下 x 才能交出去。",
      inputs: [{ id: "x", label: "x =", def: 2 }, { id: "n", label: "n =", def: 4 }]
    },
    gcd: {
      title: "递归求最大公约数 gcd(m, n)",
      hint: "归来时不用再计算，答案在最深一层就已经算出来了，逐层原样往上传（尾递归）。",
      inputs: [{ id: "m", label: "m =", def: 24 }, { id: "n2", label: "n =", def: 18 }]
    }
  };

  var mode = "isprime";
  var steps = [];
  var stepIndex = -1;
  var autoTimer = null;

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $("board"), logEl = $("log"), controlsEl = $("controls"), hintEl = $("hint");

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

  // ---------- pure step builders (also unit-tested via node, see scratchpad) ----------

  function buildIsPrimeSteps(n) {
    var steps = [];
    var frames = [{ name: "main", sub: "n = " + n }];
    frames.push({ name: "isPrime(n=" + n + ")", sub: "", status: "active" });
    steps.push({ frames: clone(frames), log: "main 调用 isPrime(" + n + ")，实参的值被拷贝进新栈帧的形参 n（值传递）。" });

    if (n < 2) {
      frames[1].sub = "n<2，不满足素数定义";
      frames[1].status = "basecase";
      steps.push({ frames: clone(frames), log: "n<2，直接 return false，不用进循环。" });
      frames[1].returnValue = "false";
      frames[1].status = "returning";
      steps.push({ frames: clone(frames), log: "isPrime 计算完毕，return false。" });
      frames.pop();
      frames[0].sub = "n = " + n + "，isPrime 返回 false";
      steps.push({ frames: clone(frames), log: "isPrime 栈帧弹出，main 拿到返回值 false，据此输出 no。", done: true });
      return steps;
    }

    var traceLines = [];
    var i = 2, returnedFalse = false;
    while (i * i <= n) {
      var rem = n % i;
      var line;
      if (rem === 0) {
        line = "i=" + i + "：i*i=" + (i * i) + " ≤ n 成立，n%" + i + "=0，找到约数！return false。";
        traceLines.push(line);
        frames[1].sub = traceLines.join("<br>");
        steps.push({ frames: clone(frames), log: line });
        returnedFalse = true;
        break;
      } else {
        line = "i=" + i + "：i*i=" + (i * i) + " ≤ n 成立，n%" + i + "=" + rem + "≠0，继续下一个 i。";
        traceLines.push(line);
        frames[1].sub = traceLines.join("<br>");
        steps.push({ frames: clone(frames), log: line });
        i++;
      }
    }
    if (!returnedFalse) {
      var line2 = "循环结束（i*i=" + (i * i) + " > n），一次约数都没找到，走到 return true。";
      traceLines.push(line2);
      frames[1].sub = traceLines.join("<br>");
      steps.push({ frames: clone(frames), log: line2 });
    }
    var result = !returnedFalse;
    frames[1].status = "returning";
    frames[1].returnValue = String(result);
    steps.push({ frames: clone(frames), log: "isPrime 计算完毕，return " + result + "。" });
    frames.pop();
    frames[0].sub = "n = " + n + "，isPrime 返回 " + result;
    steps.push({ frames: clone(frames), log: "isPrime 栈帧弹出，main 拿到返回值，据此输出 " + (result ? "yes" : "no") + "。", done: true });
    return steps;
  }

  function buildPowerSteps(x, n) {
    var steps = [];
    var frames = [{ name: "main", sub: "x=" + x + ", n=" + n }];
    for (var k = n; k >= 0; k--) {
      var f = {
        name: "power(x=" + x + ", n=" + k + ")",
        sub: k === 0 ? "" : "等待 power(x," + (k - 1) + ") 的结果...",
        status: "active", k: k
      };
      frames.push(f);
      var log = k === 0
        ? "进入 power(x, n=0)：命中边界 n==0，马上 return 1，不再往下递归。"
        : "进入 power(x, n=" + k + ")：n≠0，要先算出 power(x," + (k - 1) + ") 才能继续，本层挂起等待。";
      steps.push({ frames: clone(frames), log: log });
    }
    var childVal = null;
    while (frames.length > 1) {
      var top = frames[frames.length - 1];
      if (childVal === null) {
        top.returnValue = String(1);
        top.status = "returning";
        steps.push({ frames: clone(frames), log: "power(x, n=0) 触发边界，return 1。" });
        childVal = 1;
        frames.pop();
      } else {
        var k2 = top.k;
        var val = x * childVal;
        top.returnValue = String(val);
        top.status = "returning";
        top.sub = "拿到 power(x," + (k2 - 1) + ")=" + childVal + "，算 " + x + "×" + childVal + "=" + val;
        steps.push({ frames: clone(frames), log: "power(x, n=" + k2 + ") 拿到子调用返回的 " + childVal + "，算 " + x + " × " + childVal + " = " + val + "，把这个值交还给上一层。" });
        childVal = val;
        frames.pop();
      }
    }
    frames[0].sub = "x=" + x + ", n=" + n + "，power 返回 " + childVal;
    steps.push({ frames: clone(frames), log: "递归全部结束，main 拿到最终结果 " + childVal + "。", done: true });
    return steps;
  }

  function buildGcdSteps(m, n) {
    var steps = [];
    var frames = [{ name: "main", sub: "m=" + m + ", n=" + n }];
    var curM = m, curN = n;
    while (true) {
      var f = {
        name: "gcd(m=" + curM + ", n=" + curN + ")",
        sub: curN === 0 ? "" : "等待 gcd(" + curN + ", " + (curM % curN) + ") 的结果...",
        status: "active"
      };
      frames.push(f);
      if (curN === 0) {
        steps.push({ frames: clone(frames), log: "进入 gcd(m=" + curM + ", n=0)：命中边界 n==0，马上 return " + curM + "。" });
        break;
      } else {
        var r = curM % curN;
        steps.push({ frames: clone(frames), log: "进入 gcd(m=" + curM + ", n=" + curN + ")：n≠0，转去算 gcd(" + curN + ", " + r + ")，本层原样等待，不做任何运算。" });
        curM = curN; curN = r;
      }
    }
    var childVal = frames[frames.length - 1].name.match(/m=(-?\d+)/)[1] * 1;
    frames[frames.length - 1].returnValue = String(childVal);
    frames[frames.length - 1].status = "returning";
    steps.push({ frames: clone(frames), log: "gcd(m=" + childVal + ", n=0) 返回 " + childVal + "。" });
    frames.pop();
    while (frames.length > 1) {
      var top = frames[frames.length - 1];
      top.returnValue = String(childVal);
      top.status = "returning";
      top.sub = "直接把子调用的结果 " + childVal + " 原样往上传（尾递归，不用再计算）";
      steps.push({ frames: clone(frames), log: "gcd 这一层拿到子调用返回的 " + childVal + "，不需要再运算，原样往上传。" });
      frames.pop();
    }
    frames[0].sub = "m=" + m + ", n=" + n + "，gcd 返回 " + childVal;
    steps.push({ frames: clone(frames), log: "递归全部结束，main 拿到最终结果 " + childVal + "。", done: true });
    return steps;
  }

  // ---------- rendering ----------

  function renderFrames(frames) {
    boardEl.innerHTML = "";
    var hintDiv = document.createElement("div");
    hintDiv.className = "stack-hint";
    hintDiv.textContent = "栈底 → 栈顶（从上到下，越往下代表调用得越深）";
    boardEl.appendChild(hintDiv);
    var col = document.createElement("div");
    col.className = "stack-col";
    frames.forEach(function (f, idx) {
      var d = document.createElement("div");
      d.className = "frame" + (f.status ? " " + f.status : "");
      d.style.marginLeft = (idx * 22) + "px";
      var nameHtml = f.name;
      if (f.returnValue !== undefined) nameHtml += '<span class="rv">return ' + f.returnValue + "</span>";
      d.innerHTML = '<div class="fname">' + nameHtml + '</div>' + (f.sub ? '<div class="fsub">' + f.sub + '</div>' : '');
      col.appendChild(d);
    });
    boardEl.appendChild(col);
  }

  function render() {
    if (stepIndex < 0) {
      boardEl.innerHTML = '<div class="board-empty">点击"生成演示"开始</div>';
      logEl.innerHTML = '<div class="placeholder">// 这里会实时打印每一步的调用过程</div>';
      return;
    }
    var snap = steps[stepIndex];
    renderFrames(snap.frames);
    var lines = [];
    for (var i = 0; i <= stepIndex; i++) lines.push("<div>" + (i + 1) + ". " + steps[i].log + "</div>");
    logEl.innerHTML = lines.join("");
    logEl.scrollTop = logEl.scrollHeight;
    $("btnStep").disabled = stepIndex >= steps.length - 1;
  }

  function generate() {
    stopAuto();
    if (mode === "isprime") {
      var n = parseInt($("in_n").value, 10);
      if (isNaN(n)) n = MODE_INFO.isprime.inputs[0].def;
      $("in_n").value = n;
      steps = buildIsPrimeSteps(n);
    } else if (mode === "power") {
      var x = parseInt($("in_x").value, 10);
      var n2 = parseInt($("in_n").value, 10);
      if (isNaN(x)) x = MODE_INFO.power.inputs[0].def;
      if (isNaN(n2) || n2 < 0 || n2 > 8) n2 = MODE_INFO.power.inputs[1].def;
      $("in_x").value = x; $("in_n").value = n2;
      steps = buildPowerSteps(x, n2);
    } else {
      var m = parseInt($("in_m").value, 10);
      var n3 = parseInt($("in_n2").value, 10);
      if (isNaN(m) || m <= 0) m = MODE_INFO.gcd.inputs[0].def;
      if (isNaN(n3) || n3 <= 0) n3 = MODE_INFO.gcd.inputs[1].def;
      $("in_m").value = m; $("in_n2").value = n3;
      steps = buildGcdSteps(m, n3);
    }
    stepIndex = -1;
    nextStep();
  }

  function nextStep() {
    if (stepIndex < steps.length - 1) { stepIndex++; render(); }
    if (stepIndex >= steps.length - 1) stopAuto();
  }

  function resetAll() {
    stopAuto();
    stepIndex = -1;
    steps = [];
    render();
  }

  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; $("btnAuto").textContent = "自动播放"; }
  }

  function toggleAuto() {
    if (autoTimer) { stopAuto(); return; }
    if (steps.length === 0) generate();
    $("btnAuto").textContent = "暂停";
    autoTimer = setInterval(function () {
      if (stepIndex >= steps.length - 1) { stopAuto(); return; }
      nextStep();
    }, 1100);
  }

  function buildControls() {
    var info = MODE_INFO[mode];
    var html = "";
    info.inputs.forEach(function (inp) {
      var elId = inp.id === "n" ? "in_n" : (inp.id === "n2" ? "in_n2" : "in_" + inp.id);
      html += '<label>' + inp.label + ' <input id="' + elId + '" value="' + inp.def + '" /></label>';
    });
    html += '<button class="go" id="btnGen">生成演示</button>';
    html += '<button id="btnStep">下一步 →</button>';
    html += '<button id="btnAuto">自动播放</button>';
    html += '<button class="secondary" id="btnReset">重置</button>';
    controlsEl.innerHTML = html;
    $("btnGen").addEventListener("click", generate);
    $("btnStep").addEventListener("click", nextStep);
    $("btnAuto").addEventListener("click", toggleAuto);
    $("btnReset").addEventListener("click", resetAll);
    hintEl.textContent = info.hint;
  }

  function switchMode(m) {
    mode = m;
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.mode === m);
    });
    buildControls();
    resetAll();
  }

  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { switchMode(t.dataset.mode); });
  });

  switchMode("isprime");
})();
</script>
</body>
</html>
