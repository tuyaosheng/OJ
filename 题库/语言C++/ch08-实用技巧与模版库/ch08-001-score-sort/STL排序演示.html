<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL 容器操作 · 板书演示</title>
<style>
  :root {
    --blue: #1565c0;
    --blue-light: #e3f2fd;
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --orange: #ef6c00;
    --orange-light: #fff3e0;
    --gray: #9e9e9e;
    --ink: #263238;
    --border: #cfd8dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: #f0f2f5;
    color: var(--ink);
    padding: 24px;
  }
  h1 { text-align: center; color: var(--blue); margin: 0 0 4px; font-size: 26px; }
  .sub { text-align: center; color: #607d8b; margin-bottom: 20px; font-size: 14px; }
  .wrap {
    max-width: 1040px; margin: 0 auto; background: #fff; border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08); padding: 24px 28px 28px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    flex: 1; min-width: 140px; padding: 10px 14px; border: 2px solid var(--border);
    background: #fafafa; border-radius: 8px; cursor: pointer; font-size: 15px;
    font-weight: 600; color: #546e7a; transition: all .15s;
  }
  .tab:hover { border-color: var(--blue); color: var(--blue); }
  .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .controls {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #f5f7fa; padding: 14px 16px; border-radius: 8px; margin-bottom: 20px;
  }
  .controls label { font-size: 14px; color: #455a64; }
  .controls input {
    width: 320px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: "Consolas", monospace;
  }
  .controls button {
    padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    font-weight: 600; color: #fff; background: var(--blue); transition: opacity .15s;
  }
  .controls button:hover { opacity: .85; }
  .controls button.secondary { background: #78909c; }
  .controls button.go { background: var(--green); }
  .controls button:disabled { background: #cfd8dc; cursor: not-allowed; }
  .hint { font-size: 13px; color: #90a4ae; margin: -12px 0 18px 2px; }

  .board {
    background: #fbfcfd; border: 1px solid var(--border); border-radius: 10px;
    padding: 24px; min-height: 200px;
  }
  .board-empty { text-align: center; color: #b0bec5; padding: 40px 0; font-size: 15px; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .card {
    min-width: 84px; padding: 10px 12px; border-radius: 8px; border: 2px solid var(--border);
    background: #fff; font-family: "Consolas", monospace; text-align: center; transition: all .2s;
  }
  .card .cname { font-weight: 700; font-size: 15px; color: #455a64; }
  .card .cscore { font-size: 13px; color: #90a4ae; margin-top: 2px; }
  .card.key { border-color: var(--orange); background: var(--orange-light); }
  .card.compare { border-color: var(--blue); background: var(--blue-light); }
  .card.placed { border-color: var(--green); background: var(--green-light); }

  .cmp-banner {
    margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-family: "Consolas", monospace;
    font-size: 14px; font-weight: 600;
  }
  .cmp-banner.true { background: var(--green-light); color: var(--green); }
  .cmp-banner.false { background: var(--orange-light); color: var(--orange); }

  .qbox {
    min-width: 60px; padding: 10px 8px; border-radius: 8px; border: 2px solid var(--border);
    background: #fff; text-align: center; font-family: "Consolas", monospace; font-weight: 700;
  }
  .qbox.front { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
  .qbox.new { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .section-title { font-size: 13px; color: #90a4ae; margin: 14px 0 4px 2px; font-weight: 600; }
  .called-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .called-tag {
    padding: 4px 10px; border-radius: 12px; background: #eceff1; color: #546e7a;
    font-family: "Consolas", monospace; font-size: 13px;
  }

  .heap-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .hbox {
    min-width: 56px; padding: 10px 8px; border-radius: 8px; border: 2px solid var(--border);
    background: #fff; text-align: center; font-family: "Consolas", monospace; font-weight: 700;
  }
  .hbox.top { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
  .hbox.removed { border-color: var(--orange); background: var(--orange-light); color: var(--orange); text-decoration: line-through; opacity: .6; }
  .hbox.inserted { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .total-badge {
    display: inline-block; margin-top: 12px; padding: 4px 14px; border-radius: 12px;
    background: var(--ink); color: #fff; font-family: "Consolas", monospace; font-size: 14px;
  }

  .log {
    margin-top: 18px; background: #263238; color: #b2ff59; border-radius: 8px;
    padding: 14px 16px; font-family: "Consolas", monospace; font-size: 14px;
    min-height: 90px; max-height: 220px; overflow-y: auto; line-height: 1.7;
  }
  .log div { opacity: .55; }
  .log div:last-child { opacity: 1; color: #eeff41; }
  .log .placeholder { color: #607d8b; opacity: 1; }

  @media (prefers-color-scheme: dark) {
    body { background: #14181b; color: #e0e0e0; }
    .wrap { background: #1e2428; box-shadow: none; }
    .card, .qbox, .hbox { background: #263238; color: #e0e0e0; border-color: #37474f; }
    .card .cname { color: #cfd8dc; }
    .controls { background: #262c30; }
    .board { background: #1a1f22; border-color: #37474f; }
    .called-tag { background: #2c3639; color: #cfd8dc; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>STL 容器操作 · 电子板书</h1>
  <div class="sub">第 8 章配套演示 &nbsp;|&nbsp; 输入数据、点"下一步"，把 sort / queue / priority_queue 的内部过程拆开来看</div>

  <div class="tabs">
    <button class="tab active" data-mode="sort">sort 比较器</button>
    <button class="tab" data-mode="queue">queue 排队叫号</button>
    <button class="tab" data-mode="pq">priority_queue 合并果子</button>
  </div>

  <div class="controls" id="controls"></div>
  <div class="hint" id="hint"></div>

  <div class="board" id="board">
    <div class="board-empty">点击"生成演示"开始</div>
  </div>

  <div class="log" id="log"><div class="placeholder">// 这里会实时打印每一步发生了什么</div></div>
</div>

<script>
(function () {
  "use strict";

  var MODE_INFO = {
    sort: {
      hint: "以插入排序的过程做示范：sort 内部算法不做要求，但每一次两两比较调用 cmp 的结果，和 sort 一模一样。",
      def: "Amy 95, Ben 88, Cindy 88, Dan 76, Eva 95",
      label: "学生 姓名 分数（逗号分隔）："
    },
    queue: {
      hint: "1 x 表示编号 x 入队，2 表示队首出队叫号；分号分隔多条操作。",
      def: "1 101; 1 102; 2; 1 103; 2; 2",
      label: "操作序列（分号分隔）："
    },
    pq: {
      hint: "把堆里的元素按从小到大展示，最左边就是堆顶 top；每次弹出最左两个合并，再把结果插回正确位置。",
      def: "1, 2, 9",
      label: "果堆数量（逗号分隔）："
    }
  };

  var mode = "sort";
  var steps = [];
  var stepIndex = -1;
  var autoTimer = null;

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $("board"), logEl = $("log"), controlsEl = $("controls"), hintEl = $("hint");

  // ---------- parsing ----------

  function parseStudents(text) {
    var parts = text.split(",");
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var t = parts[i].trim();
      if (!t) continue;
      var bits = t.split(/\s+/);
      var score = parseInt(bits[bits.length - 1], 10);
      var name = bits.slice(0, bits.length - 1).join(" ");
      if (name && !isNaN(score)) out.push({ name: name, score: score });
    }
    return out;
  }

  function parseOps(text) {
    var parts = text.split(";");
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var t = parts[i].trim();
      if (!t) continue;
      var m1 = t.match(/^1\s+(-?\d+)$/);
      if (m1) { out.push({ type: "push", value: parseInt(m1[1], 10) }); continue; }
      if (t === "2") { out.push({ type: "pop" }); continue; }
    }
    return out;
  }

  function parsePiles(text) {
    return text.split(",").map(function (s) { return parseInt(s.trim(), 10); }).filter(function (v) { return !isNaN(v); });
  }

  // ---------- cmp used by sort tab: same rule taught in the lecture ----------
  function cmpStudent(a, b) {
    if (a.score !== b.score) return a.score > b.score;
    return a.name < b.name;
  }

  // ---------- pure step builders ----------

  function buildSortSteps(students) {
    var arr = students.slice();
    var n = arr.length;
    var steps = [];
    steps.push({ arr: arr.slice(), log: "初始顺序：" + arr.map(function (s) { return s.name; }).join(", "), phase: "init" });
    for (var i = 1; i < n; i++) {
      var key = arr[i];
      var j = i - 1;
      steps.push({ arr: arr.slice(), keyIdx: i, log: "取出第 " + (i + 1) + " 个学生 " + key.name + "，准备插入到前面已排好的部分。", phase: "pick" });
      while (j >= 0) {
        var result = cmpStudent(key, arr[j]);
        steps.push({
          arr: arr.slice(), compareIdx: j, keyName: key.name, cmpResult: result,
          log: "cmp(" + key.name + ", " + arr[j].name + ")：" + (result ? "返回 true，" + key.name + " 应排在 " + arr[j].name + " 前面，继续往前移" : "返回 false，" + key.name + " 不该排在 " + arr[j].name + " 前面，停止移动"),
          phase: "compare"
        });
        if (result) {
          arr[j + 1] = arr[j];
          j--;
          steps.push({ arr: arr.slice(), shiftIdx: j + 1, log: "把 " + arr[j + 1].name + " 往后挪一位，腾出位置给 " + key.name + "。", phase: "shift" });
        } else break;
      }
      arr[j + 1] = key;
      steps.push({ arr: arr.slice(), placedIdx: j + 1, log: key.name + " 插入到位，当前顺序：" + arr.map(function (s) { return s.name; }).join(", "), phase: "place" });
    }
    steps.push({ arr: arr.slice(), log: "全部插入完成，最终顺序：" + arr.map(function (s) { return s.name + "(" + s.score + ")"; }).join(", "), phase: "done", done: true });
    return steps;
  }

  function buildQueueSteps(ops) {
    var q = [], called = [];
    var steps = [];
    steps.push({ queue: q.slice(), called: called.slice(), log: "初始化，空队列。", phase: "init" });
    for (var i = 0; i < ops.length; i++) {
      var op = ops[i];
      if (op.type === "push") {
        q.push(op.value);
        steps.push({ queue: q.slice(), called: called.slice(), log: "编号 " + op.value + " 入队（排到队尾），当前队列：[" + q.join(", ") + "]", phase: "push" });
      } else {
        if (q.length === 0) { steps.push({ queue: q.slice(), called: called.slice(), log: "队列为空，无法叫号，跳过。", phase: "error" }); continue; }
        var v = q.shift();
        called.push(v);
        steps.push({ queue: q.slice(), called: called.slice(), log: "队首 " + v + " 被叫号出队，当前队列：[" + q.join(", ") + "]", phase: "pop" });
      }
    }
    steps.push({ queue: q.slice(), called: called.slice(), log: "操作全部处理完毕。叫号顺序：" + called.join(" "), phase: "done", done: true });
    return steps;
  }

  function buildMergeFruitSteps(piles) {
    var pq = piles.slice().sort(function (a, b) { return a - b; });
    var steps = [];
    var total = 0;
    steps.push({ heap: pq.slice(), log: "初始堆（从小到大展示，最左边就是堆顶 top）：" + pq.join(", "), phase: "init" });
    while (pq.length > 1) {
      var a = pq.shift(), b = pq.shift();
      var cost = a + b;
      total += cost;
      steps.push({ heap: pq.slice(), removed: [a, b], log: "取出堆顶两个最小值 " + a + " 和 " + b + "，合并代价 " + a + "+" + b + "=" + cost + "，累计总代价 " + total + "。", phase: "pop", total: total });
      var idx = 0;
      while (idx < pq.length && pq[idx] < cost) idx++;
      pq.splice(idx, 0, cost);
      steps.push({ heap: pq.slice(), inserted: cost, log: "把合并后的 " + cost + " 放回堆中（自动插入到正确的排序位置），堆变成：[" + pq.join(", ") + "]。", phase: "push", total: total });
    }
    steps.push({ heap: pq.slice(), log: "堆里只剩一堆，结束。最小总代价 = " + total + "。", phase: "done", done: true, total: total });
    return steps;
  }

  // ---------- rendering ----------

  function renderSort(snap) {
    boardEl.innerHTML = "";
    var row = document.createElement("div");
    row.className = "row";
    snap.arr.forEach(function (s, idx) {
      var c = document.createElement("div");
      c.className = "card";
      if (snap.keyIdx === idx) c.classList.add("key");
      if (snap.compareIdx === idx) c.classList.add("compare");
      if (snap.placedIdx === idx) c.classList.add("placed");
      if (snap.shiftIdx === idx) c.classList.add("compare");
      c.innerHTML = '<div class="cname">' + s.name + '</div><div class="cscore">' + s.score + ' 分</div>';
      row.appendChild(c);
    });
    boardEl.appendChild(row);
    if (snap.cmpResult !== undefined) {
      var banner = document.createElement("div");
      banner.className = "cmp-banner " + (snap.cmpResult ? "true" : "false");
      banner.textContent = "cmp(...) 返回 " + snap.cmpResult;
      boardEl.appendChild(banner);
    }
  }

  function renderQueue(snap) {
    boardEl.innerHTML = "";
    var t1 = document.createElement("div");
    t1.className = "section-title";
    t1.textContent = "队列（左边是队首 front，右边是队尾 back）";
    boardEl.appendChild(t1);
    var row = document.createElement("div");
    row.className = "row";
    if (snap.queue.length === 0) {
      var empty = document.createElement("div");
      empty.style.color = "#b0bec5";
      empty.textContent = "（空）";
      row.appendChild(empty);
    } else {
      snap.queue.forEach(function (v, idx) {
        var b = document.createElement("div");
        b.className = "qbox" + (idx === 0 ? " front" : "");
        b.textContent = v;
        row.appendChild(b);
      });
    }
    boardEl.appendChild(row);

    var t2 = document.createElement("div");
    t2.className = "section-title";
    t2.textContent = "已叫号顺序";
    boardEl.appendChild(t2);
    var crow = document.createElement("div");
    crow.className = "called-row";
    snap.called.forEach(function (v) {
      var tag = document.createElement("div");
      tag.className = "called-tag";
      tag.textContent = v;
      crow.appendChild(tag);
    });
    boardEl.appendChild(crow);
  }

  function renderPQ(snap) {
    boardEl.innerHTML = "";
    var t1 = document.createElement("div");
    t1.className = "section-title";
    t1.textContent = "小根堆（从小到大展示，最左边是堆顶）";
    boardEl.appendChild(t1);
    var row = document.createElement("div");
    row.className = "heap-row";
    if (snap.removed) {
      snap.removed.forEach(function (v) {
        var b = document.createElement("div");
        b.className = "hbox removed";
        b.textContent = v;
        row.appendChild(b);
      });
    }
    var insertedIdx = snap.inserted !== undefined ? snap.heap.indexOf(snap.inserted) : -1;
    snap.heap.forEach(function (v, idx) {
      var b = document.createElement("div");
      b.className = "hbox";
      if (idx === 0 && !snap.removed) b.classList.add("top");
      if (idx === insertedIdx) b.classList.add("inserted");
      b.textContent = v;
      row.appendChild(b);
    });
    boardEl.appendChild(row);
    if (snap.total !== undefined) {
      var badge = document.createElement("div");
      badge.className = "total-badge";
      badge.textContent = "累计总代价：" + snap.total;
      boardEl.appendChild(badge);
    }
  }

  function render() {
    if (stepIndex < 0) {
      boardEl.innerHTML = '<div class="board-empty">点击"生成演示"开始</div>';
      logEl.innerHTML = '<div class="placeholder">// 这里会实时打印每一步发生了什么</div>';
      return;
    }
    var snap = steps[stepIndex];
    if (mode === "sort") renderSort(snap);
    else if (mode === "queue") renderQueue(snap);
    else renderPQ(snap);

    var lines = [];
    for (var i = 0; i <= stepIndex; i++) lines.push("<div>" + (i + 1) + ". " + steps[i].log + "</div>");
    logEl.innerHTML = lines.join("");
    logEl.scrollTop = logEl.scrollHeight;
    $("btnStep").disabled = stepIndex >= steps.length - 1;
  }

  function generate() {
    stopAuto();
    var val = ($("in_data").value || MODE_INFO[mode].def).trim();
    $("in_data").value = val;
    if (mode === "sort") steps = buildSortSteps(parseStudents(val));
    else if (mode === "queue") steps = buildQueueSteps(parseOps(val));
    else steps = buildMergeFruitSteps(parsePiles(val));
    stepIndex = -1;
    nextStep();
  }

  function nextStep() {
    if (stepIndex < steps.length - 1) { stepIndex++; render(); }
    if (stepIndex >= steps.length - 1) stopAuto();
  }

  function resetAll() {
    stopAuto();
    stepIndex = -1;
    steps = [];
    render();
  }

  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; $("btnAuto").textContent = "自动播放"; }
  }

  function toggleAuto() {
    if (autoTimer) { stopAuto(); return; }
    if (steps.length === 0) generate();
    $("btnAuto").textContent = "暂停";
    autoTimer = setInterval(function () {
      if (stepIndex >= steps.length - 1) { stopAuto(); return; }
      nextStep();
    }, 1100);
  }

  function buildControls() {
    var info = MODE_INFO[mode];
    controlsEl.innerHTML =
      '<label>' + info.label + ' <input id="in_data" value="' + info.def + '" /></label>' +
      '<button class="go" id="btnGen">生成演示</button>' +
      '<button id="btnStep">下一步 →</button>' +
      '<button id="btnAuto">自动播放</button>' +
      '<button class="secondary" id="btnReset">重置</button>';
    $("btnGen").addEventListener("click", generate);
    $("btnStep").addEventListener("click", nextStep);
    $("btnAuto").addEventListener("click", toggleAuto);
    $("btnReset").addEventListener("click", resetAll);
    hintEl.textContent = info.hint;
  }

  function switchMode(m) {
    mode = m;
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.mode === m);
    });
    buildControls();
    resetAll();
  }

  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { switchMode(t.dataset.mode); });
  });

  switchMode("sort");
})();
</script>
</body>
</html>
