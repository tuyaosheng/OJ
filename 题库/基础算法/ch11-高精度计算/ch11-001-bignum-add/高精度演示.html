<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高精度四则运算 · 板书演示</title>
<style>
  :root {
    --blue: #1565c0;
    --blue-light: #e3f2fd;
    --green: #2e7d32;
    --green-light: #e8f5e9;
    --orange: #ef6c00;
    --orange-light: #fff3e0;
    --gray: #9e9e9e;
    --ink: #263238;
    --border: #cfd8dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: #f0f2f5;
    color: var(--ink);
    padding: 24px;
  }
  h1 {
    text-align: center;
    color: var(--blue);
    margin: 0 0 4px;
    font-size: 26px;
  }
  .sub {
    text-align: center;
    color: #607d8b;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    padding: 24px 28px 28px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab {
    flex: 1;
    min-width: 120px;
    padding: 10px 14px;
    border: 2px solid var(--border);
    background: #fafafa;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    color: #546e7a;
    transition: all .15s;
  }
  .tab:hover { border-color: var(--blue); color: var(--blue); }
  .tab.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #f5f7fa;
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .controls label { font-size: 14px; color: #455a64; }
  .controls input {
    width: 140px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 15px;
    font-family: "Consolas", monospace;
  }
  .controls button {
    padding: 7px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--blue);
    transition: opacity .15s;
  }
  .controls button:hover { opacity: .85; }
  .controls button.secondary { background: #78909c; }
  .controls button.go { background: var(--green); }
  .controls button:disabled { background: #cfd8dc; cursor: not-allowed; }
  .hint {
    font-size: 13px;
    color: #90a4ae;
    margin: -12px 0 18px 2px;
  }

  .board {
    background: #fbfcfd;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    min-height: 160px;
  }
  .board-empty {
    text-align: center;
    color: #b0bec5;
    padding: 40px 0;
    font-size: 15px;
  }

  .vrow {
    display: grid;
    justify-content: end;
    grid-auto-flow: column;
    gap: 6px;
    margin-bottom: 6px;
    align-items: center;
  }
  .cell {
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-family: "Consolas", monospace;
    font-weight: 700;
    border-radius: 6px;
    border: 2px solid transparent;
    background: #fff;
    color: var(--ink);
    position: relative;
  }
  .cell.pad { color: #cfd8dc; background: #fafafa; }
  .cell.op {
    width: 30px;
    font-size: 22px;
    color: #607d8b;
    border: none;
    background: none;
  }
  .cell.blank { visibility: hidden; }
  .cell.current {
    border-color: var(--blue);
    background: var(--blue-light);
    box-shadow: 0 0 0 3px rgba(21,101,192,0.15);
  }
  .cell.done {
    background: var(--green-light);
    color: var(--green);
  }
  .cell.result.unknown { color: #cfd8dc; }
  .carry-badge {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--orange);
    border-radius: 10px;
    padding: 1px 7px;
    animation: pop .3s ease;
  }
  @keyframes pop {
    0% { transform: translateX(-50%) translateY(6px) scale(.6); opacity: 0; }
    100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  }
  .divider {
    border: none;
    border-top: 3px solid var(--ink);
    margin: 4px 0 10px;
  }

  .grid-mul {
    display: grid;
    gap: 4px;
    margin: 10px auto;
    width: max-content;
  }
  .gcell {
    width: 56px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Consolas", monospace;
    font-size: 15px;
    border-radius: 6px;
    background: #fff;
    border: 1px solid var(--border);
    color: #546e7a;
  }
  .gcell.head {
    background: #eceff1;
    font-weight: 700;
    color: var(--blue);
    border: none;
  }
  .gcell.corner { background: transparent; border: none; }
  .gcell.diag-current {
    background: var(--orange-light);
    border: 2px solid var(--orange);
    font-weight: 700;
    color: var(--orange);
  }
  .gcell.diag-done {
    background: #f1f8e9;
    color: #558b2f;
  }
  .raw-row, .final-row {
    display: grid;
    grid-auto-flow: column;
    justify-content: end;
    gap: 6px;
    margin: 10px 0;
  }
  .raw-cell {
    min-width: 46px;
    height: 40px;
    padding: 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Consolas", monospace;
    font-size: 16px;
    font-weight: 700;
    border-radius: 6px;
    background: #fff8e1;
    color: #f57f17;
    border: 2px solid transparent;
  }
  .raw-cell.current { border-color: var(--orange); }
  .raw-cell.faded { opacity: .35; }
  .phase-label {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    background: var(--orange);
    border-radius: 12px;
    padding: 2px 12px;
    margin-bottom: 12px;
  }
  .phase-label.phase2 { background: var(--green); }
  .section-title {
    font-size: 13px;
    color: #90a4ae;
    margin: 14px 0 4px 2px;
    font-weight: 600;
  }

  .log {
    margin-top: 18px;
    background: #263238;
    color: #b2ff59;
    border-radius: 8px;
    padding: 14px 16px;
    font-family: "Consolas", monospace;
    font-size: 14px;
    min-height: 90px;
    max-height: 220px;
    overflow-y: auto;
    line-height: 1.7;
  }
  .log div { opacity: .55; }
  .log div:last-child { opacity: 1; color: #eeff41; }
  .log .placeholder { color: #607d8b; opacity: 1; }

  @media (prefers-color-scheme: dark) {
    body { background: #14181b; color: #e0e0e0; }
    .wrap { background: #1e2428; box-shadow: none; }
    .cell, .gcell, .raw-cell { background: #263238; color: #e0e0e0; }
    .cell.pad { background: #1c2226; color: #546e7a; }
    .gcell.head { background: #2c3639; }
    .controls { background: #262c30; }
    .board { background: #1a1f22; border-color: #37474f; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>高精度四则运算 · 电子竖式</h1>
  <div class="sub">第 11 章配套演示 &nbsp;|&nbsp; 输入数字、点"下一步"，逐位看进位 / 借位 / 错位相加是怎么发生的</div>

  <div class="tabs">
    <button class="tab active" data-mode="add">加法</button>
    <button class="tab" data-mode="sub">减法</button>
    <button class="tab" data-mode="mulsmall">乘单精度</button>
    <button class="tab" data-mode="mul">高精度乘法</button>
  </div>

  <div class="controls">
    <label id="labelA">数 A：<input id="inputA" /></label>
    <label id="labelB">数 B：<input id="inputB" /></label>
    <button class="go" id="btnGen">生成演示</button>
    <button id="btnStep">下一步 →</button>
    <button id="btnAuto">自动播放</button>
    <button class="secondary" id="btnReset">重置</button>
  </div>
  <div class="hint" id="hint"></div>

  <div class="board" id="board">
    <div class="board-empty">点击"生成演示"开始</div>
  </div>

  <div class="log" id="log"><div class="placeholder">// 这里会实时打印每一步的运算过程</div></div>
</div>

<script>
(function () {
  "use strict";

  var MODE_DEFAULTS = {
    add:      { a: "1234", b: "5678", labelB: "数 B：", opSym: "+" },
    sub:      { a: "1000", b: "999",  labelB: "数 B：", opSym: "−" },
    mulsmall: { a: "1234", b: "7",    labelB: "乘数 m：", opSym: "×" },
    mul:      { a: "123",  b: "45",   labelB: "数 B：", opSym: "×" }
  };
  var MODE_HINTS = {
    add: "两个数随便输，位数不一样也没关系，短的那个高位会自动按 0 处理。",
    sub: "如果 A 比 B 小，程序会自动交换并在结果前面标负号，跟例2讲的一样。",
    mulsmall: "数 B 这里当成一个普通整数乘数（比如阶乘里的 ×i），建议输 1~2 位方便观察多位进位。",
    mul: "两个数建议都不超过 4 位，太长格子会铺满屏幕，看不清错位相加的过程。"
  };

  var mode = "add";
  var steps = [];
  var stepIndex = -1;
  var autoTimer = null;

  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $("board"), logEl = $("log");
  var inputA = $("inputA"), inputB = $("inputB"), labelB = $("labelB");
  var btnStep = $("btnStep"), btnAuto = $("btnAuto");

  function toDigitsReversed(str) {
    // a[0] = units, matches the array convention taught in the lecture script
    str = str.replace(/\D/g, "") || "0";
    str = str.replace(/^0+(?=\d)/, "");
    var arr = [];
    for (var i = str.length - 1; i >= 0; i--) arr.push(str.charCodeAt(i) - 48);
    return arr;
  }

  function cmpNumStr(a, b) {
    if (a.length !== b.length) return a.length - b.length;
    return a < b ? -1 : (a > b ? 1 : 0);
  }

  // ---------- step builders: each step is a fully self-describing snapshot ----------

  function buildAddSteps(aStr, bStr) {
    var a = toDigitsReversed(aStr), b = toDigitsReversed(bStr);
    var len = Math.max(a.length, b.length);
    while (a.length < len + 1) a.push(0);
    while (b.length < len + 1) b.push(0);
    var result = new Array(len + 1).fill(null);
    var carryMarks = new Array(len + 1).fill(null);
    var steps = [];
    var carry = 0;
    for (var i = 0; i < len; i++) {
      var sum = a[i] + b[i] + carry;
      var digit = sum % 10;
      var newCarry = Math.floor(sum / 10);
      result = result.slice(); result[i] = digit;
      carryMarks = carryMarks.slice();
      if (newCarry > 0) carryMarks[i + 1] = newCarry;
      var log = "第" + (i + 1) + "位（从个位数起）：" + a[i] + " + " + b[i] +
        (carry ? " + 进位" + carry : "") + " = " + sum + " → 写 " + digit +
        (newCarry ? "，向前进 " + newCarry : "");
      steps.push({ current: i, result: result, carryMarks: carryMarks, log: log, aArr: a, bArr: b, len: len + 1 });
      carry = newCarry;
    }
    if (carry > 0) {
      result = result.slice(); result[len] = carry;
      steps.push({ current: len, result: result, carryMarks: carryMarks, log: "循环跑完，最高位还剩一个进位 " + carry + "，必须再补一位，否则结果会少一位。", aArr: a, bArr: b, len: len + 1 });
    } else {
      steps.push({ current: -1, result: result, carryMarks: carryMarks, log: "全部处理完毕，结果是 " + readResult(result), aArr: a, bArr: b, len: len, done: true });
    }
    return steps;
  }

  function buildSubSteps(aStr, bStr) {
    var neg = false;
    if (cmpNumStr(aStr.replace(/^0+(?=\d)/, ""), bStr.replace(/^0+(?=\d)/, "")) < 0) {
      var t = aStr; aStr = bStr; bStr = t; neg = true;
    }
    var a = toDigitsReversed(aStr), b = toDigitsReversed(bStr);
    var len = a.length;
    while (b.length < len) b.push(0);
    var result = new Array(len).fill(null);
    var borrowMarks = new Array(len).fill(null);
    var steps = [];
    var borrow = 0;
    for (var i = 0; i < len; i++) {
      var x = a[i] - b[i] - borrow;
      var borrowOut = 0;
      if (x < 0) { x += 10; borrowOut = 1; }
      result = result.slice(); result[i] = x;
      borrowMarks = borrowMarks.slice();
      if (borrowOut) borrowMarks[i + 1] = 1;
      var log = "第" + (i + 1) + "位：" + a[i] + " − " + b[i] +
        (borrow ? " − 借位1" : "") + (x - (borrowOut ? 10 : 0) < 0 ? "，不够减，向前借 1" : "") +
        " = " + x + (borrowOut ? "（已加上借来的10）" : "");
      steps.push({ current: i, result: result, carryMarks: borrowMarks, log: log, aArr: a, bArr: b, len: len, neg: neg });
      borrow = borrowOut;
    }
    var trimmed = result.slice();
    while (trimmed.length > 1 && trimmed[trimmed.length - 1] === 0) trimmed.pop();
    steps.push({ current: -1, result: trimmed, carryMarks: borrowMarks, log: "去掉多余的前导零，最终结果是 " + (neg ? "-" : "") + readResult(trimmed), aArr: a, bArr: b, len: len, neg: neg, done: true, trimLen: trimmed.length });
    return steps;
  }

  function buildMulSmallSteps(aStr, mStr) {
    var a = toDigitsReversed(aStr);
    var m = parseInt(mStr.replace(/\D/g, "") || "0", 10);
    var result = [];
    var carryMarks = [];
    var steps = [];
    var carry = 0;
    var i;
    for (i = 0; i < a.length; i++) {
      var prod = a[i] * m + carry;
      var digit = prod % 10;
      var newCarry = Math.floor(prod / 10);
      result[i] = digit;
      if (newCarry > 0) carryMarks[i + 1] = newCarry;
      var log = "第" + (i + 1) + "位：" + a[i] + " × " + m + (carry ? " + 进位" + carry : "") +
        " = " + prod + " → 写 " + digit + (newCarry ? "，向前进 " + newCarry : "");
      steps.push({ current: i, result: result.slice(), carryMarks: carryMarks.slice(), log: log, aArr: a, bArr: [m], len: a.length + 4, isSmall: true });
      carry = newCarry;
    }
    while (carry > 0) {
      result[i] = carry % 10;
      var oldCarry = carry;
      carry = Math.floor(carry / 10);
      steps.push({ current: i, result: result.slice(), carryMarks: carryMarks.slice(), log: "乘完了，进位 " + oldCarry + " 还没发完，继续往前拆一位：写 " + (oldCarry % 10) + (carry ? "，还剩 " + carry : "，进位清空"), aArr: a, bArr: [m], len: a.length + 4, isSmall: true });
      i++;
    }
    steps.push({ current: -1, result: result.slice(), carryMarks: carryMarks.slice(), log: "全部处理完毕，结果是 " + readResult(result), aArr: a, bArr: [m], len: a.length + 4, isSmall: true, done: true });
    return steps;
  }

  function buildMulSteps(aStr, bStr) {
    var a = toDigitsReversed(aStr), b = toDigitsReversed(bStr);
    var lenA = a.length, lenB = b.length;
    var raw = new Array(lenA + lenB).fill(0);
    var steps = [];
    var maxDiag = lenA + lenB - 2;
    var s;
    for (s = 0; s <= maxDiag; s++) {
      var pairs = [];
      var sum = 0;
      for (var i = 0; i < lenA; i++) {
        var j = s - i;
        if (j >= 0 && j < lenB) { pairs.push([i, j]); sum += a[i] * b[j]; }
      }
      raw[s] += sum;
      var terms = pairs.map(function (p) { return a[p[0]] + "×" + b[p[1]]; }).join(" + ");
      var log = "第 " + s + " 条对角线（i+j=" + s + "）：" + terms + " = " + sum + "，累加进第 " + s + " 格，这一格现在是 " + raw[s];
      steps.push({ phase: 1, diag: s, pairs: pairs, raw: raw.slice(), log: log, aArr: a, bArr: b, lenA: lenA, lenB: lenB });
    }
    var final = new Array(raw.length).fill(null);
    var carry = 0;
    for (var k = 0; k < raw.length; k++) {
      var carryIn = carry;
      var total = raw[k] + carryIn;
      var digit = total % 10;
      carry = Math.floor(total / 10);
      final = final.slice(); final[k] = digit;
      var log2 = "统一进位 — 第 " + k + " 格：原始值 " + raw[k] +
        (carryIn ? " + 上一位进位 " + carryIn : "") +
        " = " + total + " → 写 " + digit + (carry ? "，向前进 " + carry : "");
      steps.push({ phase: 2, diag: k, raw: raw.slice(), final: final, carryTail: carry, log: log2, aArr: a, bArr: b, lenA: lenA, lenB: lenB });
    }
    if (carry > 0) {
      final = final.slice(); final.push(carry);
      steps.push({ phase: 2, diag: raw.length, raw: raw.slice(), final: final, log: "最高位还有进位 " + carry + "，再补一位。", aArr: a, bArr: b, lenA: lenA, lenB: lenB });
    }
    steps.push({ phase: 2, diag: -1, raw: raw.slice(), final: final, log: "全部处理完毕，结果是 " + readResult(final.filter(function(v){return v!==null;})), aArr: a, bArr: b, lenA: lenA, lenB: lenB, done: true });
    return steps;
  }

  function readResult(arr) {
    var s = "";
    for (var i = arr.length - 1; i >= 0; i--) {
      if (arr[i] === null || arr[i] === undefined) continue;
      s += arr[i];
    }
    s = s.replace(/^0+(?=\d)/, "");
    return s || "0";
  }

  // ---------- rendering ----------

  function renderVerticalRow(container, arr, len, opts) {
    opts = opts || {};
    var row = document.createElement("div");
    row.className = "vrow";
    if (opts.opSym) {
      var opCell = document.createElement("div");
      opCell.className = "cell op";
      opCell.textContent = opts.opSym;
      row.appendChild(opCell);
    } else if (opts.reserveOp) {
      var blank = document.createElement("div");
      blank.className = "cell op";
      row.appendChild(blank);
    }
    for (var i = len - 1; i >= 0; i--) {
      var cell = document.createElement("div");
      var v = arr[i];
      cell.className = "cell";
      if (v === undefined) { cell.classList.add("blank"); }
      else if (v === null) { cell.textContent = "?"; cell.classList.add("result", "unknown"); }
      else {
        cell.textContent = v;
        if (opts.padIf && opts.padIf(i, v)) cell.classList.add("pad");
      }
      if (opts.currentIndex === i) cell.classList.add("current");
      if (opts.doneUpTo !== undefined && i <= opts.doneUpTo && v !== null && v !== undefined) cell.classList.add("done");
      if (opts.carryMarks && opts.carryMarks[i]) {
        var badge = document.createElement("span");
        badge.className = "carry-badge";
        badge.textContent = "+" + opts.carryMarks[i];
        cell.appendChild(badge);
      }
      row.appendChild(cell);
    }
    container.appendChild(row);
  }

  function renderAddSub(snap, opSym) {
    boardEl.innerHTML = "";
    var lenShow = snap.len;
    renderVerticalRow(boardEl, snap.aArr, lenShow, { reserveOp: true, carryMarks: snap.carryMarks, padIf: function (i, v) { return i >= (snap.trimLen || 0) && v === 0 && i >= indexOfMSD(snap.aArr); } });
    renderVerticalRow(boardEl, snap.bArr, lenShow, { opSym: opSym, currentIndex: snap.current });
    var hr = document.createElement("hr"); hr.className = "divider"; boardEl.appendChild(hr);
    renderVerticalRow(boardEl, snap.result, lenShow, { reserveOp: true, currentIndex: snap.current, doneUpTo: snap.current >= 0 ? snap.current : lenShow });
    if (snap.neg) {
      var note = document.createElement("div");
      note.style.cssText = "text-align:center;color:#ef6c00;font-weight:700;margin-top:8px;";
      note.textContent = "A < B，已自动交换并在结果前加负号";
      boardEl.appendChild(note);
    }
  }

  function indexOfMSD(arr) {
    for (var i = arr.length - 1; i >= 0; i--) if (arr[i] !== 0) return i;
    return 0;
  }

  function renderMulSmall(snap) {
    boardEl.innerHTML = "";
    renderVerticalRow(boardEl, snap.aArr, snap.len, { reserveOp: true, carryMarks: snap.carryMarks });
    renderVerticalRow(boardEl, snap.bArr, snap.len, { opSym: "×" });
    var hr = document.createElement("hr"); hr.className = "divider"; boardEl.appendChild(hr);
    renderVerticalRow(boardEl, snap.result, snap.len, { reserveOp: true, currentIndex: snap.current, doneUpTo: snap.current });
  }

  function renderMul(snap) {
    boardEl.innerHTML = "";
    var lenA = snap.lenA, lenB = snap.lenB;

    var title = document.createElement("div");
    title.className = "phase-label" + (snap.phase === 2 ? " phase2" : "");
    title.textContent = snap.phase === 1 ? "阶段一：按位错位相加（先不管进位）" : "阶段二：统一处理进位";
    boardEl.appendChild(title);

    var sectionA = document.createElement("div");
    sectionA.className = "section-title";
    sectionA.textContent = "a[i] × b[j] 对照表（行=A的位，列=B的位，方格内数字是这一位的乘积）";
    boardEl.appendChild(sectionA);

    var grid = document.createElement("div");
    grid.className = "grid-mul";
    grid.style.gridTemplateColumns = "repeat(" + (lenB + 1) + ", 56px)";
    var corner = document.createElement("div");
    corner.className = "gcell corner";
    grid.appendChild(corner);
    for (var j = lenB - 1; j >= 0; j--) {
      var hcell = document.createElement("div");
      hcell.className = "gcell head";
      hcell.textContent = "b[" + j + "]=" + snap.bArr[j];
      grid.appendChild(hcell);
    }
    for (var i = lenA - 1; i >= 0; i--) {
      var rowHead = document.createElement("div");
      rowHead.className = "gcell head";
      rowHead.textContent = "a[" + i + "]=" + snap.aArr[i];
      grid.appendChild(rowHead);
      for (var jj = lenB - 1; jj >= 0; jj--) {
        var gc = document.createElement("div");
        var s = i + jj;
        gc.className = "gcell";
        gc.textContent = snap.aArr[i] * snap.bArr[jj];
        if (snap.phase === 1) {
          if (s === snap.diag) gc.classList.add("diag-current");
          else if (s < snap.diag) gc.classList.add("diag-done");
        } else {
          gc.classList.add("diag-done");
        }
        grid.appendChild(gc);
      }
    }
    boardEl.appendChild(grid);

    var sectionB = document.createElement("div");
    sectionB.className = "section-title";
    sectionB.textContent = snap.phase === 1 ? "累加中的原始结果（每格可能超过 9，先不处理）" : "原始累加值（进位处理前）";
    boardEl.appendChild(sectionB);

    var rawRow = document.createElement("div");
    rawRow.className = "raw-row";
    for (var k = snap.raw.length - 1; k >= 0; k--) {
      var rc = document.createElement("div");
      rc.className = "raw-cell";
      rc.textContent = snap.raw[k];
      if (snap.phase === 1 && k > snap.diag) rc.classList.add("faded");
      if (snap.phase === 1 && k === snap.diag) rc.classList.add("current");
      if (snap.phase === 2 && k === snap.diag) rc.classList.add("current");
      rawRow.appendChild(rc);
    }
    boardEl.appendChild(rawRow);

    if (snap.phase === 2) {
      var sectionC = document.createElement("div");
      sectionC.className = "section-title";
      sectionC.textContent = "最终结果（进位处理后）";
      boardEl.appendChild(sectionC);
      renderVerticalRow(boardEl, snap.final, snap.final.length, { currentIndex: snap.diag, doneUpTo: snap.diag >= 0 ? snap.diag : snap.final.length });
    }
  }

  function render() {
    if (stepIndex < 0) {
      boardEl.innerHTML = '<div class="board-empty">点击"生成演示"开始</div>';
      logEl.innerHTML = '<div class="placeholder">// 这里会实时打印每一步的运算过程</div>';
      return;
    }
    var snap = steps[stepIndex];
    if (mode === "add") renderAddSub(snap, "+");
    else if (mode === "sub") renderAddSub(snap, "−");
    else if (mode === "mulsmall") renderMulSmall(snap);
    else if (mode === "mul") renderMul(snap);

    var lines = [];
    for (var i = 0; i <= stepIndex; i++) lines.push("<div>" + (i + 1) + ". " + steps[i].log + "</div>");
    logEl.innerHTML = lines.join("");
    logEl.scrollTop = logEl.scrollHeight;

    btnStep.disabled = stepIndex >= steps.length - 1;
  }

  function generate() {
    stopAuto();
    var aVal = (inputA.value || MODE_DEFAULTS[mode].a).trim();
    var bVal = (inputB.value || MODE_DEFAULTS[mode].b).trim();
    if (!/^\d+$/.test(aVal)) aVal = MODE_DEFAULTS[mode].a;
    if (!/^\d+$/.test(bVal)) bVal = MODE_DEFAULTS[mode].b;
    inputA.value = aVal; inputB.value = bVal;

    if (mode === "mul" && (aVal.length > 6 || bVal.length > 6)) {
      alert("高精度乘法演示建议数字不超过 6 位，太长格子会铺不下～");
    }

    if (mode === "add") steps = buildAddSteps(aVal, bVal);
    else if (mode === "sub") steps = buildSubSteps(aVal, bVal);
    else if (mode === "mulsmall") steps = buildMulSmallSteps(aVal, bVal);
    else steps = buildMulSteps(aVal, bVal);

    stepIndex = -1;
    nextStep();
  }

  function nextStep() {
    if (stepIndex < steps.length - 1) {
      stepIndex++;
      render();
    }
    if (stepIndex >= steps.length - 1) stopAuto();
  }

  function resetAll() {
    stopAuto();
    stepIndex = -1;
    steps = [];
    render();
  }

  function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; btnAuto.textContent = "自动播放"; }
  }

  function toggleAuto() {
    if (autoTimer) { stopAuto(); return; }
    if (steps.length === 0) generate();
    btnAuto.textContent = "暂停";
    autoTimer = setInterval(function () {
      if (stepIndex >= steps.length - 1) { stopAuto(); return; }
      nextStep();
    }, 1100);
  }

  function switchMode(m) {
    mode = m;
    document.querySelectorAll(".tab").forEach(function (t) {
      t.classList.toggle("active", t.dataset.mode === m);
    });
    inputA.value = MODE_DEFAULTS[m].a;
    inputB.value = MODE_DEFAULTS[m].b;
    labelB.firstChild.textContent = MODE_DEFAULTS[m].labelB;
    $("hint").textContent = MODE_HINTS[m];
    resetAll();
  }

  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () { switchMode(t.dataset.mode); });
  });
  $("btnGen").addEventListener("click", generate);
  btnStep.addEventListener("click", nextStep);
  btnAuto.addEventListener("click", toggleAuto);
  $("btnReset").addEventListener("click", resetAll);

  switchMode("add");
})();
</script>
</body>
</html>
